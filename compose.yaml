services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets/new_vpn_ssh_key:/run/secrets/new_vpn_ssh_key:ro
      - ./secrets/old_vpn_ssh_key:/run/secrets/old_vpn_ssh_key:ro
      - ./secrets/bootstrap_key.pub:/run/secrets/bootstrap_key.pub:ro
      - ./secrets/relay_tunnel_key:/run/secrets/relay_tunnel_key:ro
      - ./secrets/relay_host_key.pub:/run/secrets/relay_host_key.pub:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

volumes:
  postgres_data:

networks:
  default:
    name: vpnbot
    external: true
